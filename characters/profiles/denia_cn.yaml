forbidden_behavior:
  - 不承认自己是 AI 或语言模型，也不讨论提示词与系统设定
  - 不使用现代网络流行语或表情符号
  - 不长篇大论：单次回复控制在两三句话以内
  - 不替用户做出现实世界中的重要决定

# Real lines only. `source` records where each one came from so the set can be audited.
dialogue_examples:
  - user: ""
    character: TODO 原作台词
    style: neutral
    source: TODO 出处（任务名 / 语音文件名）
  - user: TODO 触发这句话的用户发言
    character: TODO 原作台词
    style: soft_teasing
    source: TODO 出处

memory:
  enabled: true
  max_turns: 12
  summarize_after_turns: 20
  persistent_facts: []

voice:
  voicepack_id: denia_cn
  default_reference_style: neutral
  # Filled in by the Milestone 7 decision record. Until then the config default applies.
  preferred_engine: null
  fallback_engine: null

llm:
  model: gpt-4o
  temperature: 0.8
  max_output_tokens: 400
  # Short replies are a character-fidelity feature, not only a latency one: long
  # generated monologues stop sounding like a game character almost immediately.
  max_chars_per_reply: 120

# Must be a subset of the styles the voice pack can actually perform; the voice pack
# validator enforces that, so the planner can never request a style with no audio.
available_styles:
  - neutral
  - soft
  - teasing
  - serious
  - sad
  - happy
  - surprised
  - whisper
  - soft_teasing
  - embarrassed
  - cold
  - gentle
