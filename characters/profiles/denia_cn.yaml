# Character Profile — Denia (Chinese)
#
# TEMPLATE. The personality, background and world-knowledge fields below are neutral
# placeholders, not sourced lore. Fill them in from the actual source material before
# Milestone 8, and put real, verbatim lines in `dialogue_examples` — those lines are the
# single highest-value content in this file. Paraphrased or LLM-invented "examples" are
# worse than none: they teach the model a voice that is not the character's.
#
# This profile describes what she says. How she sounds lives in her voice pack
# (`voicepacks/denia_cn`), referenced by id below and never duplicated here.

character_id: denia_cn
character_name: 迪尼娅
language: zh-CN

