# Application configuration.
#
# Layering: this file, then CVAI__section__key environment variables, then any
# --set overrides on the command line. ${VAR} and ${VAR:-default} are expanded at
# load time, so secrets stay out of the repository.

default_character: cartethyia_cn
log_level: INFO

paths:
  voicepacks: voicepacks
  characters: characters/profiles
  runs: runs
  models: models

benchmark:
  base_seed: 20260921
  # null = each engine's native rate. Resampling everything to a common rate is
  # tempting for fairness but throws away the 48 kHz output that v4-class engines
  # produce, which is part of what is being judged.
  output_sample_rate: null
  repeats: 1
  skip_unavailable: true

providers:
  tts:
    # Until Milestone 7 picks a winner, the default is the dependency-free mock so
    # the pipeline runs anywhere. The benchmark addresses engines by instance name
    # regardless of this setting.
    active: mock
    instances:
      mock:
        type: mock
        options:
          sample_rate: 24000

      # --- spec-mandated candidates ------------------------------------------
      gpt_sovits:
        type: gpt_sovits
        enabled: true
        options:
          base_url: ${GPT_SOVITS_URL:-http://127.0.0.1:9880}
          engine_version: v2ProPlus
          # Defaults mirror api_v2.py; override per candidate in the benchmark.
          top_k: 15
          top_p: 1.0
          temperature: 1.0
          text_split_method: cut5
          speed_factor: 1.0
          repetition_penalty: 1.35
          sample_steps: 32
          native_sample_rate: 32000

      qwen3_tts:
        type: qwen3_tts
        enabled: true
        options:
          base_url: ${QWEN3_TTS_URL:-http://127.0.0.1:9881}
          engine_version: Qwen3-TTS-12Hz-1.7B-Base
          auto_instruct: true

      fish_speech:
        type: fish_speech
        enabled: true
        options:
          base_url: ${FISH_SPEECH_URL:-http://127.0.0.1:8888}
          engine_version: openaudio-s1-mini
          require_precomputed_tokens: true

      # --- optional candidates added after the technology survey --------------
      index_tts:
        type: index_tts
        enabled: true
        options:
          base_url: ${INDEX_TTS_URL:-http://127.0.0.1:9882}
          engine_version: IndexTTS-2.5
          emo_alpha: 0.8

      cosyvoice:
        type: cosyvoice
        enabled: true
        options:
          base_url: ${COSYVOICE_URL:-http://127.0.0.1:9883}
          engine_version: Fun-CosyVoice3-0.5B

      voxcpm:
        type: voxcpm
        enabled: true
        options:
          base_url: ${VOXCPM_URL:-http://127.0.0.1:9884}
          engine_version: VoxCPM2

  stt:
    active: ${CVAI_STT:-openai}
    instances:
      openai:
        type: openai
        options:
          model: gpt-4o-transcribe
          api_key: ${OPENAI_API_KEY:-}
      # Local Mandarin ASR. Better than Whisper-family models on short Chinese
      # utterances, takes real weighted hotwords for character names, and keeps the
      # user's microphone off someone else's server. Needs `.[preprocess]`.
      funasr:
        type: funasr
        options:
          model: paraformer-zh
          punctuation_model: ct-punc
          device: ${CVAI_ASR_DEVICE:-cpu}

  llm:
    # LLM_PROVIDER picks an instance below (CVAI_LLM is accepted as an alias). The
    # default is local Qwen3 through Ollama: no API key, no per-token cost.
    active: ${LLM_PROVIDER:-ollama}
    instances:
      ollama:
        type: ollama
        options:
          model: ${LLM_MODEL:-qwen3:4b}
          # 127.0.0.1 rather than localhost: on Windows "localhost" can resolve to ::1
          # first, while Ollama listens on IPv4 only.
          base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
          temperature: 0.7
          max_output_tokens: 400
          # qwen3:4b always reasons first; with think on, Ollama returns the reasoning
          # separately and only the answer is streamed. Off, it leaks into the answer.
          think: ${OLLAMA_THINK:-true}
          thinking_token_budget: 4096
          num_ctx: ${OLLAMA_NUM_CTX:-8192}
          keep_alive: 30m
      # Scripted replies, no key and no network — `CVAI_LLM=mock cvai-talk demo_zh`
      # exercises the whole pipeline offline. It is not a language model and says so.
      mock:
        type: mock
      openai:
        type: openai
        options:
          model: ${OPENAI_MODEL:-gpt-4o}
          api_key: ${OPENAI_API_KEY:-}
          temperature: 0.8
          max_output_tokens: 400
      # Google Gemini free tier (key from https://aistudio.google.com/apikey) through
      # its OpenAI-compatible endpoint. Gemini 3 always thinks; "low" keeps it quick.
      gemini:
        type: openai
        options:
          model: ${GEMINI_MODEL:-gemini-3.8-flash}
          api_key: ${GEMINI_API_KEY:-}
          base_url: https://generativelanguage.googleapis.com/v1beta/openai/
          temperature: 0.8
          max_output_tokens: 400
          reasoning_effort: ${GEMINI_REASONING:-low}
      # Any model on OpenRouter through its OpenAI-compatible API. `:free` models cost
      # nothing (rate-limited); e.g. OPENROUTER_MODEL=moonshotai/kimi-k2-0905 for Kimi.
      openrouter:
        type: openai
        options:
          model: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
          api_key: ${OPENROUTER_API_KEY:-}
          base_url: https://openrouter.ai/api/v1
          temperature: 0.8
          max_output_tokens: 400
